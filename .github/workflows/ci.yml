name: MoonCam 检查
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装固定 MoonBit 工具链
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
          bash /tmp/install-moonbit.sh "$(cat .moonbit-version)"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: 格式与严格检查
        run: |
          node scripts/check-toolchain.mjs --exact
          node scripts/version.mjs
          moon version --all
          moon fmt --check
          moon check --deny-warn --target all
          moon info
          git diff --exit-code -- '*.mbti'
      - name: 多后端测试与纯 MoonBit 示例
        run: |
          moon test --target wasm
          moon test --target wasm-gc
          moon test --target js
          moon test --target native
          moon run examples/library --target wasm-gc
      - name: 构建、导出与独立验证
        run: |
          npm run build
          npm run docs:check
          npm run test:integration
          python tests/oracle.py
          python -m pip install -r requirements-test.txt
          python tests/dxf_interop.py
          npm run demo
          npm run benchmark
          npm run performance:check
      - name: 浏览器测试
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: 保存报告与浏览器截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mooncam-validation
          path: |
            artifacts/
            test-results/
            web/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mooncam-validation
          path: validated
      - name: Assemble validated static workbench
        run: |
          mkdir -p _site/docs
          cp -R validated/web _site/web
          cp -R examples _site/examples
          cp -R docs/images _site/docs/images
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=web/"><title>MoonCam</title><a href="web/">打开 MoonCam 工作台</a>' > _site/index.html
          touch _site/.nojekyll
          test -s _site/web/engine.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy workbench
        id: deployment
        uses: actions/deploy-pages@v4
