name: MoonCam 检查
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装固定 MoonBit 工具链
        shell: bash
        run: |
          VERSION="$(cat .moonbit-version)"
          echo "installing moonc $VERSION"
          if [ "$RUNNER_OS" = "Windows" ]; then
            MOONBIT_INSTALL_VERSION="$VERSION" pwsh -NoProfile -Command "irm https://cli.moonbitlang.com/install/powershell.ps1 | iex"
            echo "$USERPROFILE/.moon/bin" >> "$GITHUB_PATH"
          else
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
            bash /tmp/install-moonbit.sh "$VERSION"
            echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          fi
      - name: 格式与严格检查
        shell: bash
        run: |
          node scripts/check-toolchain.mjs --exact
          node scripts/version.mjs
          moon version --all
          moon fmt --check
          moon check --deny-warn --target all
          moon info
          git diff --exit-code -- '*.mbti'
      - name: 双后端测试与纯 MoonBit 示例
        shell: bash
        run: |
          moon test --target js
          moon test --target wasm-gc
          moon run examples/library --target wasm-gc
      - name: 其余后端（Linux）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          moon test --target wasm
          moon test --target native
      - name: 构建、导出与独立验证
        shell: bash
        run: |
          npm run build
          npm run docs:check
          npm run test:readme
          npm run test:coverage
          npm run test:integration
          npm run test:consistency:checker
          npm run test:property
          python -m pip install -r requirements-test.txt
          python tests/oracle.py
          python tests/sampling_experiment.py
          python tests/oracle_highprec.py
          python tests/dxf_interop.py
          npm run demo
          npm run benchmark
          npm run performance:check
      - name: 跨平台一致性清单
        shell: bash
        run: node tests/consistency.mjs
      - name: 浏览器测试（Linux）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: 保存报告、清单与浏览器截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mooncam-validation-${{ matrix.os }}
          path: |
            artifacts/
            test-results/
            web/

  # 同一份清单在不同操作系统上必须一致：先比对规范化摘要，再在失败时报告数值差异。
  consistency:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 收集各平台清单
        uses: actions/download-artifact@v4
        with:
          pattern: mooncam-validation-*
          path: downloaded
      - name: 比对 Windows 与 Linux
        shell: bash
        run: |
          mkdir -p artifacts/consistency
          find downloaded -name 'manifest-*.json' -print -exec cp {} artifacts/consistency/ \;
          ls -l artifacts/consistency
          node tests/consistency.check.mjs artifacts/consistency --require-platforms=win32,linux

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, consistency]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mooncam-validation-ubuntu-latest
          path: validated
      - name: Assemble validated static workbench
        run: |
          mkdir -p _site/docs
          cp -R validated/web _site/web
          cp -R examples _site/examples
          cp -R docs/images _site/docs/images
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=web/"><title>MoonCam</title><a href="web/">打开 MoonCam 工作台</a>' > _site/index.html
          touch _site/.nojekyll
          test -s _site/web/engine.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy workbench
        id: deployment
        uses: actions/deploy-pages@v4
